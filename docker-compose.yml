# Single-VM simulation of the active-active deployment:
# one nginx load balancer in front of two identical app nodes.

services:
  lb:
    image: nginx:1.31.6-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - node-a
      - node-b

  node-a:
    build: .
    image: nginx-react-app:local
    environment:
      NODE_ID: node-a

  node-b:
    image: nginx-react-app:local
    environment:
      NODE_ID: node-b
