name: Deploy React App

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/dianwinata88/nginx-react-app

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build React app
        run: npm run build

  image:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Rolling deploy: node A first, node B only after A is healthy.
  # Both nodes stay "active" — traffic is never drained, so the
  # surviving node absorbs load while its peer restarts.
  deploy-node-a:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to node A
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            ${{ vars.DEPLOY_USER }}@${{ vars.NODE_A_HOST }} \
            'NODE_ID=node-a IMAGE_TAG=${{ github.sha }} GHCR_TOKEN=${{ secrets.GHCR_READ_TOKEN }} bash -s' \
            < scripts/deploy-node.sh

  deploy-node-b:
    needs: deploy-node-a
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to node B
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
            ${{ vars.DEPLOY_USER }}@${{ vars.NODE_B_HOST }} \
            'NODE_ID=node-b IMAGE_TAG=${{ github.sha }} GHCR_TOKEN=${{ secrets.GHCR_READ_TOKEN }} bash -s' \
            < scripts/deploy-node.sh

  verify:
    needs: [deploy-node-a, deploy-node-b]
    runs-on: ubuntu-latest
    steps:
      - name: Check load balancer sees both nodes
        run: |
          set -e
          for i in 1 2 3 4; do
            curl -fsS "http://${{ vars.LB_HOST }}/healthz"
            sleep 1
          done
