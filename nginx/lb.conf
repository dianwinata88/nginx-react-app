# Load balancer for the active-active pair.
# Round-robin by default: successive requests alternate node-a / node-b.

upstream react_app {
    server node-a:80 max_fails=2 fail_timeout=10s;
    server node-b:80 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    location = /lb-status {
        default_type application/json;
        return 200 '{"lb":"up"}\n';
    }

    location / {
        proxy_pass http://react_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Passive failover: retry a failed request on the other node.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
